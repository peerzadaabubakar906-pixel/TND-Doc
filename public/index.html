<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Title & Description Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0F1418;
    color: #E8ECEE;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .topbar {
    background: linear-gradient(135deg, #0A1830, #0D2340);
    border-bottom: 1px solid #1B3A5C;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .topbar-inner {
    max-width: 720px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-logo {
    height: 42px;
    width: auto;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #4FD1C5, #2C9C8F);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-weight: 900; color: #0F1418; font-size: 16px;
  }
  .title { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .subtitle { font-size: 12.5px; color: #7C8991; }
  button.settings-btn {
    display: flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid #2A333A; color: #B7C0C6;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  .panel {
    background: #161C21; border: 1px solid #262F36; border-radius: 12px;
    padding: 18px; margin-bottom: 22px; display: none;
  }
  .panel.open { display: block; }
  .panel-title { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .panel-desc { font-size: 12.5px; color: #7C8991; margin-bottom: 10px; line-height: 1.5; }
  textarea {
    width: 100%; background: #0F1418; border: 1px solid #2A333A; border-radius: 8px;
    color: #E8ECEE; padding: 12px; font-size: 13px; line-height: 1.6;
    resize: vertical; font-family: inherit;
  }
  textarea:focus { outline: none; border-color: #4FD1C5; }
  .save-row { display: flex; justify-content: flex-end; margin-top: 10px; }
  .save-btn {
    background: #4FD1C5; color: #0F1418; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .save-btn.saved { background: #2C9C8F; }
  label { font-size: 13px; color: #B7C0C6; display: block; margin-bottom: 8px; }
  #transcript { width: 100%; font-size: 14px; margin-bottom: 14px; }
  .error {
    background: rgba(220,90,90,0.12); border: 1px solid rgba(220,90,90,0.3);
    color: #E8A0A0; border-radius: 8px; padding: 10px 12px; font-size: 13px;
    margin-bottom: 14px; display: none;
  }
  .error.show { display: block; }
  .generate-btn {
    width: 100%; background: #4FD1C5; color: #0F1418; border: none;
    border-radius: 10px; padding: 13px 16px; font-size: 14.5px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 24px;
  }
  .generate-btn:disabled { background: #2A333A; color: #7C8991; cursor: default; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .result-card {
    background: #161C21; border: 1px solid #262F36; border-radius: 10px;
    padding: 14px; margin-bottom: 14px;
  }
  .result-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .result-label { font-size: 11.5px; color: #7C8991; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
  .copy-btn { background: transparent; border: none; color: #7C8991; cursor: pointer; font-size: 12px; }
  .copy-btn.copied { color: #4FD1C5; }
  .result-value { font-size: 15px; font-weight: 600; line-height: 1.6; white-space: pre-wrap; }
  .result-value.multiline { font-size: 13.5px; font-weight: 400; }
  .add-row { display: flex; justify-content: flex-end; margin-bottom: 24px; }
  .add-btn {
    background: transparent; color: #4FD1C5; border: 1px solid #2C9C8F;
    border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .add-btn.added { background: #2C9C8F; color: #0F1418; border-color: #2C9C8F; cursor: default; }
  .add-btn:disabled { opacity: 0.6; }
  .list-section { margin-bottom: 24px; }
  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .list-title { font-size: 13.5px; font-weight: 700; color: #B7C0C6; }
  .list-count { font-size: 12px; color: #7C8991; }
  .list-item {
    background: #161C21; border: 1px solid #262F36; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 10px;
  }
  .list-item-body { min-width: 0; }
  .list-item-title { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .list-item-desc { font-size: 12px; color: #7C8991; line-height: 1.5; white-space: pre-wrap; }
  .list-item-remove {
    background: transparent; border: none; color: #7C8991; cursor: pointer;
    font-size: 16px; line-height: 1; flex-shrink: 0;
  }
  .list-item-remove:hover { color: #E8A0A0; }
  .download-btn {
    width: 100%; background: #4FD1C5; color: #0F1418; border: none;
    border-radius: 10px; padding: 13px 16px; font-size: 14.5px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 10px;
  }
  .download-btn:disabled { background: #2A333A; color: #7C8991; cursor: default; }
</style>
</head>

<div class="wrap">
  <div class="header">
    <div class="brand">
    </div>
  </div>

  <label for="transcript">Paste your transcript</label>
  <textarea id="transcript" rows="10" placeholder="Paste your transcript here..."></textarea>

  <div class="error" id="errorBox"></div>

  <button class="generate-btn" id="generateBtn">
    <span id="btnText">✦ Title & Description</span>
  </button>

  <div id="results"></div>

  <div class="list-section" id="listSection" style="display:none;">
    <div class="list-head">
      <div class="list-title">Added Items</div>
      <div class="list-count" id="listCount">0</div>
    </div>
    <div id="listItems"></div>
  </div>

  <button class="download-btn" id="downloadBtn" disabled>⬇ Download Doc</button>
  <button class="download-btn" id="downloadTranscriptsBtn" disabled>⬇ Download Transcripts</button>
</div>

<script>
const INSTRUCTIONS = `Give the Following Instructions to ChatGPT
Consider this a fresh set of instructions. Ignore any past prompts or prior instructions from memory. I will provide transcripts for reels that will be posted on multiple social channels, including LinkedIn, Facebook, Instagram, Twitter/X, and YouTube.
For each transcript, create one strong social media set consisting of:
- A title
- A description
- 5-6 hashtags

Please follow all instructions below carefully.
General Rules
1. Titles and descriptions should be engaging and reader-focused.
2. Use U.S. English with simple and easy-to-understand wording.
3. Do not use typical AI-generated terms such as "AI," "navigate," "delve," "demystifying," "unlock," or similar words.
4. Do not use dashes ("-") or em dashes ("—").
5. Do not use emojis.
6. Do not use phrases such as "in this short" or "in this clip."
7. The description should be written as a single paragraph.
8. Do not copy the transcript verbatim. Instead, write a concise, social-friendly, and engaging summary.
9. The title and description must align with the content and reflect the transcript's core message.
10. The structure should be strong and optimized for social media.
11. Do not use phrases such as "this helps readers" or similar wording.
12. Titles should preferably be written in question format.
13. Do not use anyone's name, and write everything in fourth person style.

Formatting Instructions
Use the following format:
Title X: [Your title here]
Description: [One-paragraph social-friendly description here]
Hashtags: #[TopicalHashtag] #[OtherRelevantHashtags]

Example Set
Title 1: What Does It Take to Modify a Child Custody Order?
Description: Changing a custody order is not as simple as asking the court for a new arrangement. In North Carolina, a parent must show a substantial change in circumstances since the last order was entered, and that change must affect the child's well-being. This may include major changes in living conditions, parenting ability, or the child's needs. Without this proof, the court cannot revisit custody or issue a new decision based on the child's best interests.
Hashtags: #ChildCustody #FamilyLaw #CustodyModification #NorthCarolinaLaw #LegalStandards #Parenting

Now apply the same style to the transcript below. Put the title text in the "title" field, and combine the description paragraph followed by the hashtags on a new line in the "description" field.`;

const transcriptBox = document.getElementById('transcript');
const generateBtn = document.getElementById('generateBtn');
const btnText = document.getElementById('btnText');
const errorBox = document.getElementById('errorBox');
const results = document.getElementById('results');
const listSection = document.getElementById('listSection');
const listItemsEl = document.getElementById('listItems');
const listCountEl = document.getElementById('listCount');
const downloadBtn = document.getElementById('downloadBtn');
const downloadTranscriptsBtn = document.getElementById('downloadTranscriptsBtn');

let currentResult = null; // { title, description, transcript } of the most recently generated (not yet added) result
let addedItems = [];      // all items the user has clicked "Add" on ({ title, description, transcript })

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}
function hideError() {
  errorBox.classList.remove('show');
}

function copyText(text, btn) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  const original = btn.textContent;
  btn.textContent = 'Copied ✓';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1200);
}

function renderResult(title, description, transcript) {
  results.innerHTML = '';
  currentResult = { title, description, transcript };

  const titleCard = document.createElement('div');
  titleCard.className = 'result-card';
  titleCard.innerHTML = `
    <div class="result-head">
      <div class="result-label">Title</div>
      <button class="copy-btn">Copy</button>
    </div>
    <div class="result-value"></div>
  `;
  titleCard.querySelector('.result-value').textContent = title;
  titleCard.querySelector('.copy-btn').addEventListener('click', (e) => copyText(title, e.target));
  results.appendChild(titleCard);

  const descCard = document.createElement('div');
  descCard.className = 'result-card';
  descCard.innerHTML = `
    <div class="result-head">
      <div class="result-label">Description</div>
      <button class="copy-btn">Copy</button>
    </div>
    <div class="result-value multiline"></div>
  `;
  descCard.querySelector('.result-value').textContent = description;
  descCard.querySelector('.copy-btn').addEventListener('click', (e) => copyText(description, e.target));
  results.appendChild(descCard);

  const addRow = document.createElement('div');
  addRow.className = 'add-row';
  addRow.innerHTML = `<button class="add-btn">+ Add to List</button>`;
  const addBtn = addRow.querySelector('.add-btn');
  addBtn.addEventListener('click', () => {
    addItemToList(currentResult.title, currentResult.description, currentResult.transcript);
    addBtn.textContent = 'Added ✓';
    addBtn.classList.add('added');
    addBtn.disabled = true;
  });
  results.appendChild(addRow);
}

function renderList() {
  listCountEl.textContent = addedItems.length;
  listSection.style.display = addedItems.length ? 'block' : 'none';
  downloadBtn.disabled = addedItems.length === 0;
  downloadTranscriptsBtn.disabled = addedItems.length === 0;

  listItemsEl.innerHTML = '';
  addedItems.forEach((item, index) => {
    const el = document.createElement('div');
    el.className = 'list-item';
    el.innerHTML = `
      <div class="list-item-body">
        <div class="list-item-title"></div>
        <div class="list-item-desc"></div>
      </div>
      <button class="list-item-remove" title="Remove">✕</button>
    `;
    el.querySelector('.list-item-title').textContent = `${index + 1}. ${item.title}`;
    el.querySelector('.list-item-desc').textContent = item.description;
    el.querySelector('.list-item-remove').addEventListener('click', () => {
      addedItems.splice(index, 1);
      renderList();
    });
    listItemsEl.appendChild(el);
  });
}

function addItemToList(title, description, transcript) {
  addedItems.push({ title, description, transcript: transcript || '' });
  renderList();
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function splitDescriptionAndHashtags(raw) {
  const lines = String(raw).split('\n').map(l => l.trim()).filter(l => l.length);
  const descLines = [];
  const hashtagLines = [];
  lines.forEach(line => {
    const words = line.split(/\s+/).filter(Boolean);
    const hashCount = words.filter(w => w.startsWith('#')).length;
    if (words.length && hashCount / words.length > 0.5) {
      hashtagLines.push(line);
    } else {
      descLines.push(line);
    }
  });
  return {
    description: descLines.join(' '),
    hashtags: hashtagLines.join(' ')
  };
}

function downloadDoc() {
  if (addedItems.length === 0) return;

  let body = '';
  addedItems.forEach((item, i) => {
    const { description, hashtags } = splitDescriptionAndHashtags(item.description);
    body += `
      <p style="font-family:Calibri,Arial,sans-serif;font-size:12pt;margin:0 0 2px 0;"><b>Title ${i + 1}:</b></p>
      <p style="font-family:Calibri,Arial,sans-serif;font-size:12pt;margin:0 0 14px 0;">${escapeHtml(item.title)}</p>

      <p style="font-family:Calibri,Arial,sans-serif;font-size:12pt;margin:0 0 2px 0;"><b>Description:</b></p>
      <p style="font-family:Calibri,Arial,sans-serif;font-size:12pt;margin:0 0 14px 0;">${escapeHtml(description)}</p>

      <p style="font-family:Calibri,Arial,sans-serif;font-size:12pt;margin:0 0 2px 0;"><b>Hashtags:</b></p>
      <p style="font-family:Calibri,Arial,sans-serif;font-size:12pt;margin:0 0 20px 0;">${escapeHtml(hashtags)}</p>
      <hr style="border:none;border-top:1px solid #ccc;margin:0 0 20px 0;">
    `;
  });

  const html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>Titles & Descriptions</title></head>
    <body>${body}</body>
    </html>
  `;

  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'titles-and-descriptions.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

downloadBtn.addEventListener('click', downloadDoc);

function downloadTranscriptsDoc() {
  if (addedItems.length === 0) return;

  let body = '';
  addedItems.forEach((item, i) => {
    body += `
      <p style="font-family:Calibri,Arial,sans-serif;font-size:12pt;margin:0 0 2px 0;"><b>Transcript ${i + 1}:</b></p>
      <p style="font-family:Calibri,Arial,sans-serif;font-size:12pt;margin:0 0 20px 0;white-space:pre-wrap;">${escapeHtml(item.transcript).replace(/\n/g, '<br>')}</p>
      <hr style="border:none;border-top:1px solid #ccc;margin:0 0 20px 0;">
    `;
  });

  const html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>Transcripts</title></head>
    <body>${body}</body>
    </html>
  `;

  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'transcripts.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

downloadTranscriptsBtn.addEventListener('click', downloadTranscriptsDoc);


generateBtn.addEventListener('click', async () => {
  hideError();
  results.innerHTML = '';
  currentResult = null;
  const transcript = transcriptBox.value.trim();
  if (!transcript) {
    showError('Please paste a transcript first.');
    return;
  }

  generateBtn.disabled = true;
  btnText.innerHTML = '<span class="spin">↻</span> Generating...';

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ instructions: INSTRUCTIONS, transcript })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.details || data.error || 'Server error');
    renderResult(data.title, data.description, transcript);
  } catch (e) {
    console.error('Generate failed:', e);
    showError(e.message || 'Something went wrong. Please try again.');
  } finally {
    generateBtn.disabled = false;
    btnText.textContent = '✦ Title & Description';
  }
});
</script>
</body>
</html>
